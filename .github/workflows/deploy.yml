name : Deploy Hospital Managemnet System
"on" :
  push :
    branches :
      _main
      workflow_dispatch:
permissions:
    contents: read
    pages: write
    id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: $
{{steps.deployment.outputs.page_url}}
runs-on: ubuntu-latest
steps:
  -name: checkout
  uses: actions/checkout@v4
  -name: Setuo Pages
  uses: actions/configure-pages@v5
  -name: upload website files
  uses: actions/configure-pages-artifact@v4
  with:
    path: frontend/docs
  -name: Deploy website
  id: deployment
  uses: actions/deploy-pages@v4
      
